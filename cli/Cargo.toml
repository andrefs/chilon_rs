[package]
name = "chilon-cli"
version = "1.3.2"
edition = "2021"

[[bin]]
name = "chilon_rs"
path = "src/main.rs"

[[bin]]
name = "gen-viz"
path = "src/bin/gen-viz.rs"

[[bin]]
name = "test-files"
path = "src/bin/test-files.rs"

[dependencies]
chilon_rs = { path = "..", version = "1.3.2" }
clap = { version = "4.1", features = ["derive"] }
num_cpus = "1.13.1"
log = "0.4.0"
simplelog = "0.12.0"
chrono = "0.4.23"
serde_json = "1.0"


[package]
name = "chilon-cli"
version = "2.0.2"
edition = "2021"
description = "CLI for chilon_rs - namespace-based RDF graph summarization"
homepage = "https://github.com/andrefs/chilon_rs"
repository = "https://github.com/andrefs/chilon_rs"
license = "MIT"
readme = "README.md"

[[bin]]
name = "chilon_rs"
path = "src/main.rs"

[[bin]]
name = "gen-viz"
path = "src/bin/gen-viz.rs"

[[bin]]
name = "test-files"
path = "src/bin/test-files.rs"

[dependencies]
chilon_rs = "2.0.2"
clap = { version = "4.1", features = ["derive"] }
num_cpus = "1.13.1"
log = "0.4.0"
simplelog = "0.12.0"
chrono = "0.4.23"
serde_json = "1.0"
oxttl = "0.2.3"
